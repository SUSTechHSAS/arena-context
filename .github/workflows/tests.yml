name: Protocol tests

on:
  pull_request:
    branches: [main, 'task/**', AerraGen-main]
    paths:
      - '.github/scripts/**'
      - '.github/vendor/**'
      - '.github/fingerprint-policy.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

# Candidate code runs only here, with no write token or saved credentials.
# The privileged Protocol workflow continues to execute trusted base code.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/*.test.*
